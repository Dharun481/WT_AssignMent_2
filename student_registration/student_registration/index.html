<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Portal</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Student Registration</h2>
        <form id="registrationForm" novalidate>
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter full name">
                <div class="error" id="nameError"></div>
            </div>

            <div class="form-group">
                <label for="rollNo">Roll Number</label>
                <input type="text" id="rollNo" placeholder="Enter roll number">
                <div class="error" id="rollNoError"></div>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" placeholder="Enter email address">
                <div class="error" id="emailError"></div>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Create a strong password">
                <div class="error" id="passwordError"></div>
                <small>Must be at least 8 characters, with 1 uppercase, 1 lowercase, and 1 number.</small>
            </div>

            <div class="form-group">
                <label for="course">Course</label>
                <select id="course">
                    <option value="">Select a course...</option>
                    <option value="cs">Computer Science Enginnering</option>
                    <option value="ee">Electrical Engineering</option>
                    <option value="me">Mechanical Engineering</option>
                    <option value="ba">Business Administration</option>
                </select>
                <div class="error" id="courseError"></div>
            </div>

            <div class="form-group">
                <label for="document">Upload ID Proof (PDF/Image)</label>
                <input type="file" id="document" accept=".pdf, image/*">
                <div class="error" id="documentError"></div>
            </div>

            <button type="submit">Register Student</button>
            <div id="registrationStatus" class="status" role="status" aria-live="polite"></div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
